id: coding-task
label: Coding Task

steps:
  - id: implement
    label: Implement
    can_agent_complete_alone: true
    agent_hint: Write the code. Prefer small, focused commits.

  - id: tests
    label: Write Tests
    can_agent_complete_alone: true
    agent_hint: Add or update tests. Coverage must not regress.
    blocks_next: true

  - id: review
    label: Review
    can_agent_complete_alone: false
    agent_hint: Human reviews diff before any merge action.
    triggered_by: pr_comment

  - id: commit
    label: Commit & Push
    can_agent_complete_alone: true
    agent_hint: Commit with a conventional commit message, push, open PR.
