schema: spec-driven

context: |
  Tech stack: Node 20.11+ (ESM) + Fastify 4 + better-sqlite3 11 + Zod + Pino + @modelcontextprotocol/sdk; SPA in Vite 5 + React 18 + react-markdown.
  Architecture: local-first single-process server exposing Web UI + MCP (HTTP/SSE) + REST/WS on :7733. Hexagonal module layout under src/.
  Source of truth: DESIGN.md at repo root. BRIEF-DESIGN.md scopes UI/CLI delegation. agentboard/ (gitignored) holds claude-design deliverables.
  Conventions: conventional commits; no Co-Authored-By trailers; voseo Rioplatense for Spanish UX copy.
  Testing: vitest 2.1 + jsdom 25 + @vitest/coverage-v8.

strict_tdd: true
# Strict TDD Mode active — test stack detected in package.json.

testing:
  test_runner: vitest
  framework: vitest
  command: "npm test"
  layers:
    unit: true
    integration: false   # no @testing-library/* yet; add when SPA tests need DOM assertions
    e2e: false            # no playwright/cypress yet
  coverage:
    available: true
    command: "npm test -- --coverage"
  quality:
    linter: null          # eslint not installed
    type_checker: "tsc --noEmit -p tsconfig.json"
    formatter: null       # prettier not installed
  detected_on: "2026-05-15"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Integrate UI deliverables from BRIEF-DESIGN.md when claude-design returns
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
    - Honor the 400-line review budget — split into chained PRs when forecast is high
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills from .atl/skill-registry.md
    - Use work-unit commits, tests beside the code they verify
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)
